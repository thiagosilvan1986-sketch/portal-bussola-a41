# Configuração lida na raiz do repositório: o app fica na subpasta app-financas.
# (Mantém uma cópia completa em app-financas/netlify.toml caso o "Base directory"
# seja definido pela interface do Netlify.)
[build]
  base = "app-financas"
  command = "npm run build"
  publish = "dist"

# Funções do servidor (avisos de vencimento por notificação). O firebase-admin e o web-push vão como pacotes, sem empacotar junto (dependem de módulos do Node).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "web-push"]

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# O service worker e o arquivo que ele carrega para mostrar as notificações nunca podem ficar em cache
[[headers]]
  for = "/push-handler.js"
  [headers.values]
    Cache-Control = "no-cache"
